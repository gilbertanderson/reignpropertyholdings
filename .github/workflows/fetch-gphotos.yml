name: Fetch Google Photos album

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: Public Google Photos share URL
        required: true
        default: https://photos.app.goo.gl/iHqcbMoeX1NYhRSC9
      target_branch:
        description: Branch to commit imported photos on
        required: true
        default: cursor/gphotos-property-update-80b0
  push:
    branches:
      - cursor/gphotos-property-update-80b0
    paths:
      - .gphotos-fetch-trigger

env:
  ALBUM_URL: https://photos.app.goo.gl/iHqcbMoeX1NYhRSC9

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/fetch-gphotos-playwright.py "${{ github.event.inputs.album_url || env.ALBUM_URL }}" imports/gphotos-import
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imports/gphotos-import
          if git diff --staged --quiet; then
            echo "No files to commit"
            if [ -f imports/gphotos-import/debug.json ]; then
              cat imports/gphotos-import/debug.json
            fi
            exit 1
          fi
          git commit -m "Import Google Photos album for property image update"
          git push
