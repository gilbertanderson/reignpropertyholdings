name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7b4c409e7d634a1d31882e0f06802ff9
          # Match package-lock.json. wrangler-action's implicit default is
          # 3.90.0, which cannot read wrangler.jsonc (JSON/JSONC starts at
          # 3.91.0). Pinning down to 3.90.0 (#31) failed Workers Builds for
          # that reason; pin up, never down. See HANDOFF.md §4.
          wranglerVersion: "4.127.1"
          command: pages deploy public --project-name=reignpropertyholdings
